<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Squad Shooter</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: linear-gradient(180deg, #3b5bff 0%, #6f8dff 55%, #b48cff 100%);
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      body { position: fixed; inset: 0; }
      /* portrait game: fills phones, letterboxed on wide screens (long side never over 2x the short side) */
      #game { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #1f2440; overflow: hidden; box-shadow: 0 0 40px rgba(20, 30, 70, 0.35); }
      #unity-canvas { width: 100%; height: 100%; display: block; outline: none; background: #1f2440; }
      #loader {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #3b5bff 0%, #7a96ff 70%, #b48cff 100%); transition: opacity 0.4s;
        font-family: "Arial Rounded MT Bold", Arial, sans-serif;
      }
      #loader img { width: 34%; max-width: 220px; border-radius: 22%; border: 6px solid #fff; box-shadow: 0 8px 0 rgba(40, 50, 90, 0.35); }
      #loader .title { margin-top: 5%; font-size: min(9vw, 52px); color: #ffc42e; letter-spacing: 1px; text-align: center;
        text-shadow: 0 4px 0 #3c3a4e, 3px 0 0 #3c3a4e, -3px 0 0 #3c3a4e, 0 -3px 0 #3c3a4e; }
      #loader .bar { margin-top: 7%; width: 64%; height: 26px; border-radius: 14px; background: #2e2c3e; border: 4px solid #fff; overflow: hidden; }
      #loader .fill { height: 100%; width: 0%; background: linear-gradient(180deg, #ffd25a, #f39a1e); border-radius: 10px; transition: width 0.2s; }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loader">
        <img src="TemplateData/logo.jpg" alt="">
        <div class="title">SQUAD SHOOTER</div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // ---- layout -------------------------------------------------------------------------------------
      var MAX_ASPECT = 0.62; // width / height of the game area on wide screens
      function layout() {
        var w = window.innerWidth, h = window.innerHeight, game = document.getElementById("game");
        var gw = w, gh = h;
        if (w / h > MAX_ASPECT) gw = Math.round(h * MAX_ASPECT);
        game.style.width = gw + "px";
        game.style.height = gh + "px";
      }
      window.addEventListener("resize", layout);
      window.addEventListener("orientationchange", function () { setTimeout(layout, 200); });
      layout();
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      window.addEventListener("keydown", function (e) {
        if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) >= 0) e.preventDefault();
      });

      // ---- Unity --------------------------------------------------------------------------------------
      var fill = document.getElementById("fill");
      createUnityInstance(document.querySelector("#unity-canvas"), {
          arguments: [],
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
          workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          showBanner: function (message, type) { if (type === "error") console.error(message); else console.warn(message); }
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function (instance) {
        var loader = document.getElementById("loader");
        loader.style.opacity = "0";
        setTimeout(function () { loader.style.display = "none"; }, 450);
      }).catch(function (message) {
        console.error(message);
      });
    </script>
  </body>
</html>
